[workspace]
members = ["crates/openb2c", "crates/openb2c-schema", "crates/openb2c-runtime"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
openb2c-schema = { path = "crates/openb2c-schema" }
